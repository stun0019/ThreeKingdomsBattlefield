<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三國戰場｜1280×720</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #08090a; }
    #stage {
      position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px;
      transform: translate(-50%, -50%) scale(var(--fit)); transform-origin: center;
      box-shadow: 0 0 0 1px #473822, 0 22px 100px #000;
    }
    #game { display: block; width: 1280px; height: 720px; border: 0; background: #1a120d; }
  </style>
</head>
<body>
  <div id="stage"><iframe id="game" title="三國戰場" allow="fullscreen; gamepad"></iframe></div>
  <script type="module">
    import { gameDocument } from './src/ui/game-document.js';
    const game = document.getElementById('game');
    function fit() {
      document.documentElement.style.setProperty('--fit', Math.min(innerWidth / 1280, innerHeight / 720));
    }
    addEventListener('resize', fit);
    fit();
    game.srcdoc = gameDocument;
  </script>
</body>
</html>
